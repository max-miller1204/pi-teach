name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test

      # Reason: `npm audit` walks the dev tree too, which here means auditing the Pi CLI
      # we depend on only for `import type`. That code never runs and never ships, so it
      # produces permanent noise that hides the one thing worth failing on: a problem in
      # the runtime dependencies that actually reach users.
      - name: Audit production dependencies
        run: npm run audit
